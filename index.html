    <style>
      /* Couleur de page dès le premier octet : aucun flash blanc, même sans CSS. */
      html {
        background: #f4eee4;
        color: #17140f;
      }

      /* Amorce peinte avant l'hydratation : la couverture s'installe sans saut. */
      .boot {
        font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
        font-size: clamp(0.68rem, 0.74vw, 0.78rem);
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #3c352b;
        padding: clamp(1rem, 3vw, 2.2rem) clamp(1.1rem, 4.4vw, 5.25rem) 0;
      }

      .boot__mark {
        font-family: system-ui, sans-serif;
        font-weight: 800;
        font-size: 0.95rem;
        letter-spacing: 0.02em;
        color: #17140f;
        border-bottom: 1px solid rgba(23, 20, 15, 0.34);
        padding-bottom: 0.75rem;
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 0.3rem 1.2rem;
      }

      .boot__role,
      .boot__meta {
        margin-top: 0.45rem;
      }

      /* Repli sans JavaScript : la même voix, l'essentiel, des liens qui marchent. */
      .nojs {
        padding: clamp(2rem, 6vw, 4.5rem) clamp(1.1rem, 4.4vw, 5.25rem);
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 1.05rem;
        line-height: 1.55;
        max-width: 46rem;
      }

      .nojs__kicker {
        font-family: ui-monospace, Menlo, monospace;
        font-size: 0.72rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #c9380f;
      }

      .nojs h1 {
        font-family: system-ui, sans-serif;
        font-weight: 800;
        font-size: clamp(1.6rem, 5vw, 2.4rem);
        letter-spacing: -0.03em;
        line-height: 1.05;
        text-transform: uppercase;
        margin: 0.6rem 0 1rem;
      }

      .nojs ul {
        list-style: none;
        padding: 0;
        margin: 1.2rem 0 0;
        border-top: 1px solid rgba(23, 20, 15, 0.34);
      }

      .nojs li {
        padding: 0.6rem 0;
        border-bottom: 1px solid rgba(23, 20, 15, 0.16);
      }

      .nojs a {
        color: #c9380f;
        text-decoration: underline;
      }

      .nojs__note {
        font-family: ui-monospace, Menlo, monospace;
        font-size: 0.72rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #6f6459;
        margin-top: 1.2rem;
      }
    </style>
